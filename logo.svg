<svg width="280" height="48" viewBox="0 0 280 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand Icon: Luxury Golden Sun & Egyptian Falcon Wings / Lotus -->
  <g id="brand-symbol">
    <!-- Outer Glow Circle -->
    <circle cx="24" cy="24" r="22" fill="url(#goldGrad)" opacity="0.15"/>
    <circle cx="24" cy="24" r="21" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2 1.5"/>
    
    <!-- Central Solar Disc -->
    <circle cx="24" cy="20" r="6" fill="url(#sunGrad)"/>
    <circle cx="24" cy="20" r="8" stroke="#F8AF3C" stroke-width="0.8" opacity="0.6"/>
    
    <!-- Pharaonic Lotus / Stylized Falcon Wings -->
    <path d="M12 28C14.5 24 18 22 24 22C30 22 33.5 24 36 28C32 29 28 30 24 30C20 30 16 29 12 28Z" fill="url(#goldGrad)"/>
    <path d="M10 25C13 22 17 20 24 20C31 20 35 22 38 25C34.5 24 30 23.5 24 23.5C18 23.5 13.5 24 10 25Z" fill="#FFFDF9" opacity="0.8"/>
    <path d="M17 31C19.5 34 22 35 24 35C26 35 28.5 34 31 31C28.5 32 26 32.5 24 32.5C22 32.5 19.5 32 17 31Z" fill="#F0850B"/>
    
    <!-- Horizon Line of Luxor Nile -->
    <line x1="8" y1="36" x2="40" y2="36" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <g id="brand-text">
    <!-- "LUXOR BOOKING" in bold warm white Trajan/Cinzel feel -->
    <text x="56" y="22" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      LUXOR <tspan fill="#F8AF3C">BOOKING</tspan>
    </text>
    
    <!-- "TOURS & NILE EXPEDITIONS" in refined small caps gold -->
    <text x="56" y="36" font-family="'Cinzel', Georgia, serif" font-size="9" font-weight="700" letter-spacing="3.2" fill="#E6A045">
      TOURS &amp; EXPEDITIONS
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD68A"/>
      <stop offset="50%" stop-color="#F0850B"/>
      <stop offset="100%" stop-color="#B86000"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="18" y1="14" x2="30" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="40%" stop-color="#F8AF3C"/>
      <stop offset="100%" stop-color="#D96E00"/>
    </linearGradient>
  </defs>
</svg>
